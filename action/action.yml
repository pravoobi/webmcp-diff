name: "WebMCP Contract Diff"
description: "Snapshot the WebMCP tool contract a web app exposes to agents and fail the PR on breaking or risk-increasing changes."
author: "webmcp-contract-diff"
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  config:
    description: "Path to the extractor config JSON (baseUrl, app, routes[])."
    required: true
  server-command:
    description: "Command to start the app under test. Run in the background; the action waits for readiness."
    required: false
  ready-url:
    description: "URL to poll until the server is ready (defaults to the config's baseUrl)."
    required: false
  base-ref:
    description: "Git ref holding the committed baseline contract."
    required: false
    default: "origin/${{ github.base_ref || github.event.repository.default_branch }}"
  contract-path:
    description: "Path to the committed contract file."
    required: false
    default: "webmcp-contract.json"
  semantic:
    description: "Run the LLM-assisted description-drift check (needs ANTHROPIC_API_KEY)."
    required: false
    default: "false"
  risk-as-warning:
    description: "Do not fail the job on risk-increasing-only changes."
    required: false
    default: "false"
  comment:
    description: "Post the markdown diff as a PR comment."
    required: false
    default: "true"
  update-on-push:
    description: "On a push to the default branch, rewrite the committed contract and commit it back."
    required: false
    default: "false"
  cli-version:
    description: "Version (npm dist-tag or semver) of @webmcp-contract/cli to run."
    required: false
    default: "latest"

outputs:
  exit-code:
    description: "0 if no blocking changes, 1 otherwise."
    value: ${{ steps.diff.outputs.exit-code }}
  report:
    description: "Path to the generated markdown report."
    value: ${{ steps.diff.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Resolve base URL
      id: cfg
      shell: bash
      run: |
        base_url="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('${{ inputs.config }}','utf8')).baseUrl)")"
        echo "base-url=$base_url" >> "$GITHUB_OUTPUT"
        echo "ready-url=${{ inputs.ready-url }}" >> "$GITHUB_OUTPUT"

    - name: Install Playwright browser
      shell: bash
      run: npx --yes playwright@1 install --with-deps chromium

    - name: Start app
      if: inputs.server-command != ''
      shell: bash
      run: |
        nohup bash -c '${{ inputs.server-command }}' > "${RUNNER_TEMP}/app.log" 2>&1 &
        echo $! > "${RUNNER_TEMP}/app.pid"

    - name: Wait for readiness
      if: inputs.server-command != ''
      shell: bash
      run: |
        url="${{ steps.cfg.outputs.ready-url }}"
        [ -z "$url" ] && url="${{ steps.cfg.outputs.base-url }}"
        for i in $(seq 1 60); do
          if curl -sfo /dev/null "$url"; then echo "ready: $url"; exit 0; fi
          sleep 1
        done
        echo "::error::app did not become ready at $url"
        cat "${RUNNER_TEMP}/app.log" || true
        exit 1

    - name: Diff contract
      id: diff
      shell: bash
      env:
        SEMANTIC_FLAG: ${{ inputs.semantic == 'true' && '--semantic' || '' }}
        RISK_FLAG: ${{ inputs.risk-as-warning == 'true' && '--risk-as-warning' || '' }}
      run: |
        report="${RUNNER_TEMP}/webmcp-contract-diff.md"
        set +e
        npx --yes "@webmcp-contract/cli@${{ inputs.cli-version }}" check \
          --config "${{ inputs.config }}" \
          --base "${{ inputs.base-ref }}" \
          --contract "${{ inputs.contract-path }}" \
          --format md \
          $SEMANTIC_FLAG $RISK_FLAG \
          -o "$report"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        body="$(cat "${{ steps.diff.outputs.report }}")"
        marker="<!-- webmcp-contract-diff -->"
        printf '%s\n\n%s\n' "$marker" "$body" > "${RUNNER_TEMP}/comment.md"
        existing="$(gh pr view "${{ github.event.number }}" --json comments \
          --jq '.comments[] | select(.body | startswith("<!-- webmcp-contract-diff -->")) | .url' | head -n1)"
        if [ -n "$existing" ]; then
          gh api "repos/${{ github.repository }}/issues/comments/${existing##*-}" -X PATCH -F body=@"${RUNNER_TEMP}/comment.md" || \
            gh pr comment "${{ github.event.number }}" --body-file "${RUNNER_TEMP}/comment.md"
        else
          gh pr comment "${{ github.event.number }}" --body-file "${RUNNER_TEMP}/comment.md"
        fi

    - name: Refresh committed contract
      if: inputs.update-on-push == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      run: |
        npx --yes "@webmcp-contract/cli@${{ inputs.cli-version }}" snapshot \
          --config "${{ inputs.config }}" -o "${{ inputs.contract-path }}" --quiet
        if ! git diff --quiet -- "${{ inputs.contract-path }}"; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.contract-path }}"
          git commit -m "chore: refresh webmcp contract [skip ci]"
          git push
        fi

    - name: Stop app
      if: always() && inputs.server-command != ''
      shell: bash
      run: |
        [ -f "${RUNNER_TEMP}/app.pid" ] && kill "$(cat "${RUNNER_TEMP}/app.pid")" 2>/dev/null || true

    - name: Enforce result
      shell: bash
      run: exit ${{ steps.diff.outputs.exit-code }}
