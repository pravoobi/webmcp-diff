name: release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Gate the release on a green build + tests.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Move action version tags
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(echo '${{ steps.changesets.outputs.publishedPackages }}' | node -e "
            const p = JSON.parse(require('fs').readFileSync(0,'utf8'));
            const cli = p.find(x => x.name === '@webmcp-contract/cli');
            process.stdout.write(cli ? cli.version : '');
          ")"
          [ -z "$version" ] && { echo "no @webmcp-contract/cli release; skipping action tags"; exit 0; }
          major="v${version%%.*}"
          minor="v$(echo "$version" | cut -d. -f1-2)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for t in "v$version" "$minor" "$major"; do
            git tag -f "$t"
            git push -f origin "refs/tags/$t"
          done
          echo "action tags: v$version, $minor, $major → $(git rev-parse --short HEAD)"
