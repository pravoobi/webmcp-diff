<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dress Shop</title>
    <script src="/polyfill.js"></script>
  </head>
  <body>
    <h1>Dress Shop</h1>
    <p>A tiny WebMCP-enabled storefront.</p>
    <nav><a href="/dresses">Dresses</a> · <a href="/cart">Cart</a></nav>

    <script type="module">
      const ctl = new AbortController();
      await document.modelContext.registerTool(
        {
          name: "get_shop_info",
          description: "Return the shop name, opening hours, and shipping regions.",
          inputSchema: { type: "object", properties: {} },
          annotations: { readOnlyHint: true },
          execute: async () => ({
            name: "Dress Shop",
            hours: "9-18 Mon-Sat",
            ships: ["US", "CA", "EU"],
          }),
        },
        { signal: ctl.signal },
      );
    </script>
  </body>
</html>
